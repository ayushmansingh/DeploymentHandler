{% extends "base.html" %}
{% block body %}

<div class="page-head">
  <div>
    <h1>Overview</h1>
    <p class="sub">Everything running on this server.</p>
  </div>
  <a class="btn primary" href="/deploy">Deploy an app</a>
</div>

{% if not runtime_ready %}
<div class="banner bad"><strong>This server is not ready to build apps.</strong>
{{ runtime_problem }} Contact the server administrator.</div>
{% endif %}

<div id="apps">
  {% include "_apps.html" %}
</div>

<script>
// Refresh the grid so a deploy in progress becomes a working link on its own.
// Two rules keep it from feeling twitchy: the markup is only swapped when it
// has actually changed, and once nothing is building the poll drops to a slow
// background check.
const appsEl = document.getElementById("apps");
const BUSY_MS = 3000;
const IDLE_MS = 20000;

function isBusy() {
  const marker = appsEl.querySelector("[data-busy]");
  return marker ? marker.dataset.busy === "1" : false;
}

async function refreshApps() {
  let wait = isBusy() ? BUSY_MS : IDLE_MS;
  if (!document.hidden) {
    try {
      const html = await fetch("/partials/apps").then(r => r.text());
      // Only touch the DOM when something differs, so nothing flickers and
      // nothing moves out from under a click.
      if (html.trim() !== appsEl.innerHTML.trim()) appsEl.innerHTML = html;
      wait = isBusy() ? BUSY_MS : IDLE_MS;
    } catch (err) { /* transient; try again on the next tick */ }
  }
  setTimeout(refreshApps, wait);
}
setTimeout(refreshApps, isBusy() ? BUSY_MS : IDLE_MS);
</script>
{% endblock %}
