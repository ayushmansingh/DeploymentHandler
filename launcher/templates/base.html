<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}App Launcher{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1a1d21; --muted: #626b77;
    --line: #e3e6ea; --accent: #2f6bd8; --ok: #1a7f4b; --bad: #c1352b;
    --warn: #a86b00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; }
  header a { color: inherit; text-decoration: none; font-weight: 600; font-size: 17px; }
  main { max-width: 940px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 20px; margin-bottom: 18px; }
  label { display: block; font-weight: 600; margin: 14px 0 5px; font-size: 14px; }
  input[type=text], input[type=file] { width: 100%; padding: 9px 11px;
          border: 1px solid var(--line); border-radius: 7px; font: inherit; background: #fff; }
  button, .btn { font: inherit; padding: 9px 15px; border-radius: 7px; cursor: pointer;
          border: 1px solid var(--line); background: #fff; color: var(--ink);
          text-decoration: none; display: inline-block; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
          background: #eef0f3; color: var(--muted); }
  .pill.live { background: #e4f4ea; color: var(--ok); }
  .pill.failed { background: #fdeceb; color: var(--bad); }
  .pill.building { background: #fdf3e0; color: var(--warn); }
  pre.log { background: #16181c; color: #dfe3e8; padding: 14px; border-radius: 8px;
          overflow-x: auto; max-height: 460px; overflow-y: auto; font-size: 12.5px;
          line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .banner { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .banner.bad { background: #fdeceb; border: 1px solid #f3c9c6; color: #7d211a; }
  .banner.ok { background: #e4f4ea; border: 1px solid #bfe3cd; color: #13603a; }
  .banner.working { background: #fdf3e0; border: 1px solid #f0dcb4; color: #6d4600; }
  .muted { color: var(--muted); }
  code { background: #eef0f3; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  details summary { cursor: pointer; font-weight: 600; }
  details summary:hover { color: var(--accent); }
  .logbar { display: flex; align-items: center; gap: 10px; margin: 12px 0 10px; }
  .logbar .stamp { font-size: 12.5px; color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* Dashboard */
  .page-head { display: flex; align-items: center; justify-content: space-between;
          gap: 16px; margin-bottom: 2px; }
  .page-head h1 { margin: 0; }
  .grid { display: grid; gap: 14px; margin-bottom: 26px;
          grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }

  /* The whole card is the click target for opening the app; the Manage link
     sits above it so it stays separately clickable. */
  /* Flex column so the action row sits at the bottom of every card, however
     much text the card above it holds. */
  .app-card { position: relative; display: flex; flex-direction: column;
          background: var(--card); border: 1px solid var(--line);
          border-left: 3px solid var(--line); border-radius: 10px; padding: 15px 16px;
          transition: box-shadow .12s ease, transform .12s ease; }
  .app-card.live { border-left-color: var(--ok); }
  .app-card.failed { border-left-color: var(--bad); }
  .app-card.building { border-left-color: var(--warn); }
  .app-card.live:hover { box-shadow: 0 3px 12px rgba(20,25,35,.10); transform: translateY(-1px); }
  .app-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .app-name { font-weight: 650; font-size: 16px; color: var(--ink); text-decoration: none;
          word-break: break-word; }
  .stretch::after { content: ""; position: absolute; inset: 0; border-radius: 10px; }
  .app-url { font-size: 12.5px; color: var(--accent); margin-top: 5px; word-break: break-all; }
  .app-url.muted { color: var(--muted); }
  .app-error { font-size: 12.5px; color: var(--bad); margin-top: 8px;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
          overflow: hidden; }
  .app-meta { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .app-actions { display: flex; align-items: center; justify-content: space-between;
          gap: 10px; margin-top: auto; padding-top: 14px; }
  .app-actions .hint { font-size: 12px; color: var(--muted); }
  .app-actions .manage { position: relative; z-index: 1; font-size: 13px;
          color: var(--muted); text-decoration: none; border: 1px solid var(--line);
          padding: 4px 10px; border-radius: 6px; background: #fff; margin-left: auto; }
  .app-actions .manage:hover { color: var(--ink); border-color: var(--muted); }
</style>
</head>
<body>
<header><a href="/">App Launcher</a></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
