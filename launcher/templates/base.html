<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}App Launcher{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1a1d21; --muted: #626b77;
    --line: #e3e6ea; --accent: #2f6bd8; --ok: #1a7f4b; --bad: #c1352b;
    --warn: #a86b00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 24px; }
  header a { color: inherit; text-decoration: none; font-weight: 600; font-size: 17px; }
  main { max-width: 940px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 20px; margin-bottom: 18px; }
  label { display: block; font-weight: 600; margin: 14px 0 5px; font-size: 14px; }
  input[type=text], input[type=file] { width: 100%; padding: 9px 11px;
          border: 1px solid var(--line); border-radius: 7px; font: inherit; background: #fff; }
  button, .btn { font: inherit; padding: 9px 15px; border-radius: 7px; cursor: pointer;
          border: 1px solid var(--line); background: #fff; color: var(--ink);
          text-decoration: none; display: inline-block; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
          background: #eef0f3; color: var(--muted); }
  .pill.live { background: #e4f4ea; color: var(--ok); }
  .pill.failed { background: #fdeceb; color: var(--bad); }
  .pill.building { background: #fdf3e0; color: var(--warn); }
  pre.log { background: #16181c; color: #dfe3e8; padding: 14px; border-radius: 8px;
          overflow-x: auto; max-height: 460px; overflow-y: auto; font-size: 12.5px;
          line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .banner { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
  .banner.bad { background: #fdeceb; border: 1px solid #f3c9c6; color: #7d211a; }
  .banner.ok { background: #e4f4ea; border: 1px solid #bfe3cd; color: #13603a; }
  .muted { color: var(--muted); }
  code { background: #eef0f3; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  details summary { cursor: pointer; font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header><a href="/">App Launcher</a></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
